# Point waybar at the IPC shim rather than Hyprland's socket directly.
#
# Waybar builds its socket paths from $HYPRLAND_INSTANCE_SIGNATURE, so appending
# "-shim" routes it through hypr-ipc-shim.service. This drop-in and that unit are
# the ONLY changes needed: waybar's own config and CSS are untouched, so the bar
# looks exactly the same.
#
# Why /bin/sh instead of `Environment=`: systemd does not expand one environment
# variable inside another in Environment=, and the signature is only known at
# runtime. The shell derives it from the value systemd already has (uwsm exports
# it via UWSM_FINALIZE_VARNAMES). If the variable were somehow unset, waybar
# would get a bare "-shim" and fail confusingly, so the :+ form yields an EMPTY
# value instead and waybar reports its own clear
# "HYPRLAND_INSTANCE_SIGNATURE was not set!" message.
#
# Scope is deliberately narrow: only waybar is redirected. The rejected
# alternative, `systemctl --user set-environment`, would route the entire
# session's IPC through one Python process.
[Unit]
After=hypr-ipc-shim.service
Wants=hypr-ipc-shim.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'exec env HYPRLAND_INSTANCE_SIGNATURE="${HYPRLAND_INSTANCE_SIGNATURE:+${HYPRLAND_INSTANCE_SIGNATURE}-shim}" /usr/bin/waybar'
