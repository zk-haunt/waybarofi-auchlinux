# Yazi flavor "auch" — colours from the wallpaper, written by matugen to
# ~/.config/yazi/flavors/auch.yazi/flavor.toml on every wallpaper change.
# Edit this template, not that file. Layout and symbols live in
# config/yazi/theme.toml; this is colours only.
#
# Same roles as the kitty template: primary is the accent, secondary the
# blue-ish second colour, tertiary the highlight, error the red.
# Section and key names follow Yazi 26.9.1's preset theme-dark.toml.

[mgr]
cwd             = { fg = "{{colors.primary.default.hex}}", bold = true }
find_keyword    = { fg = "{{colors.tertiary.default.hex}}", bold = true, italic = true, underline = true }
find_position   = { fg = "{{colors.secondary.default.hex}}", bg = "reset", bold = true, italic = true }
symlink_target  = { fg = "{{colors.outline.default.hex}}", italic = true }
marker_copied   = { fg = "{{colors.primary.default.hex}}",   bg = "{{colors.primary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}",     bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.tertiary.default.hex}}",  bg = "{{colors.tertiary.default.hex}}" }
count_copied    = { fg = "{{colors.on_primary.default.hex}}",  bg = "{{colors.primary.default.hex}}" }
count_cut       = { fg = "{{colors.on_error.default.hex}}",    bg = "{{colors.error.default.hex}}" }
count_selected  = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
border_style    = { fg = "{{colors.outline_variant.default.hex}}" }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
unset_main  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[indicator]
parent  = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
current = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
preview = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }

[status]
perm_sep        = { fg = "{{colors.outline.default.hex}}" }
perm_type       = { fg = "{{colors.primary.default.hex}}" }
perm_read       = { fg = "{{colors.tertiary.default.hex}}" }
perm_write      = { fg = "{{colors.error.default.hex}}" }
perm_exec       = { fg = "{{colors.secondary.default.hex}}" }
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[which]
mask            = { bg = "{{colors.surface_container.default.hex}}" }
cand            = { fg = "{{colors.primary.default.hex}}" }
rest            = { fg = "{{colors.outline.default.hex}}" }
desc            = { fg = "{{colors.on_surface_variant.default.hex}}" }
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }

[confirm]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}", bold = true }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.secondary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}" }
title_warn  = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}", bold = true }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.primary.default.hex}}", bold = true }

[help]
border  = { fg = "{{colors.primary.default.hex}}" }
chord   = { fg = "{{colors.secondary.default.hex}}" }
hovered = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }

# The preset's rules, recoloured. A flavor's rules replace the preset's
# completely, so every rule is repeated here.
[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "{{colors.tertiary.default.hex}}" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.error.default.hex}}" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "{{colors.primary.default.hex}}" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "{{colors.outline.default.hex}}" },
	# Special file
	{ url = "*", is = "orphan", bg = "{{colors.error_container.default.hex}}" },
	{ url = "*", is = "exec"  , fg = "{{colors.primary.default.hex}}" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "{{colors.error_container.default.hex}}" },
	{ url = "*/", is = "dummy", bg = "{{colors.error_container.default.hex}}" },
	# Fallback
	{ url = "*/", fg = "{{colors.secondary.default.hex}}" }
]
