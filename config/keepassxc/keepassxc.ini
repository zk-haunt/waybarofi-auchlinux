[General]
ConfigVersion=2

[PasswordGenerator]
AdditionalChars=
ExcludedChars=

[GUI]
ApplicationTheme=dark
ShowTrayIcon=true
MinimizeToTray=true
MinimizeOnClose=true
StartMinimized=true

[Security]
; Auto-lock and clipboard hygiene (plansecurity.md P7).
; KeePassXC rewrites this file on exit and DROPS keys it does not recognise, so
; if any of these disappear after a restart, the name was wrong for this version.

; Lock after 5 minutes idle. The database being open is the single biggest
; exposure on an unattended desktop — everything else in P7 is downstream of it.
LockDatabaseIdle=true
LockDatabaseIdleSeconds=300

; Lock when the session locks (hyprlock) and when minimised to tray. The tray
; case matters here because MinimizeToTray and StartMinimized are both on above,
; so the window spends most of its life hidden rather than closed.
LockDatabaseScreenLock=true
LockDatabaseMinimize=true

; Wipe copied passwords from the clipboard after 10s. Without this they sit
; there indefinitely — and cliphist records clipboard history, so a copied
; password would otherwise land in a searchable store (see the clipboard item
; in P7).
ClearClipboard=true
ClearClipboardTimeout=10

; Clear the search box too, so entry names are not left on screen.
ClearSearch=true
ClearSearchTimeout=5
