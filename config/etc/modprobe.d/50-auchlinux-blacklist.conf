# Kernel modules this laptop never needs — installed to /etc/modprobe.d/ by
# scripts/harden-system.sh (Lynis NETW-3200, STRG-1846).
#
# Why it matters even though none are loaded: the network protocols below are
# AUTO-loaded the moment any unprivileged program opens a socket of that type,
# which pulls rarely-exercised kernel code into reach of every local process.
# Each has had local privilege-escalation CVEs. `install <mod> /bin/false`
# blocks explicit `modprobe` too, not just autoloading (`blacklist` alone
# would not).
#
# dccp is not listed: it was removed from the kernel entirely.
# Undo: delete this file (takes effect for the next load attempt).

# Rare network protocols. SCTP here is the KERNEL implementation — browsers'
# WebRTC data channels use their own userspace SCTP and are unaffected.
install sctp /bin/false
install rds /bin/false
install tipc /bin/false

# FireWire: no port on this machine, and its DMA access has been used for
# physical memory-reading attacks.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
