# Harden how udisks2 mounts removable media (USB sticks, SD cards, external
# drives) when you click them in Dolphin. Without this they mount with exec and
# suid honoured, so a prepared USB stick can carry a setuid-root binary or
# something you then run by accident.
#
# nosuid  — ignore setuid/setgid bits (a root-owned setuid binary on the stick
#           can't escalate)
# nodev   — ignore device nodes (no smuggled /dev/sda to read the raw disk)
# noexec  — refuse to execute anything from the volume
#
# Scoped to removable filesystems ONLY. Deliberately not applied to /tmp:
# makepkg has no BUILDDIR set here, so noexec on /tmp breaks every AUR build.
# (plansecurity.md P4 flags this too.)
#
# If you ever need to run something off a USB drive, remount by hand:
#   sudo mount -o remount,exec /run/media/$USER/<label>
#
# Deploy:  sudo install -Dm644 config/etc/udisks2/mount_options.conf \
#            /etc/udisks2/mount_options.conf
#          sudo systemctl restart udisks2
# Revert:  sudo rm /etc/udisks2/mount_options.conf && sudo systemctl restart udisks2

[defaults]
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush,nosuid,nodev,noexec
exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro,nosuid,nodev,noexec
ntfs_defaults=uid=$UID,gid=$GID,windows_names,nosuid,nodev,noexec
ext4_defaults=nosuid,nodev,noexec
ext3_defaults=nosuid,nodev,noexec
ext2_defaults=nosuid,nodev,noexec
btrfs_defaults=nosuid,nodev,noexec
