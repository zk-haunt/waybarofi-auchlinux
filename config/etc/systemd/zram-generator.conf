# Compressed swap in RAM — installed to /etc/systemd/zram-generator.conf by
# scripts/zram.sh. zram-generator turns this into /dev/zram0 + a swap unit at
# every boot; nothing is ever written to the SSD.
#
# zram-size is the most UNCOMPRESSED data the device will hold, not RAM it
# reserves: an empty device costs nothing, and at ~3:1 (zstd on desktop memory)
# a full 8 GiB device occupies roughly 2.7 GiB of real RAM. The generator's own
# default is min(ram / 2, 4096), which on this 15 GiB machine would cap it at
# 4 GiB; min(ram, 8192) is Fedora's default.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
