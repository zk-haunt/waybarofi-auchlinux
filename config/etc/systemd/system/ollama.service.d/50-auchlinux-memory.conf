# Memory limits for ollama — installed to /etc/systemd/system/ollama.service.d/
# by scripts/ollama.sh. Measured on this 15 GiB laptop, 2026-10-07.

[Service]
# ollama's runner (llama-server) keeps the KV state of every earlier prompt in
# RAM so it can reuse it — about 105 MB per new prompt here, up to 8 GiB by
# default (llama-server --cache-ram 8192), and ollama does not set a limit.
# The 4b grew from 3.5 to 6.6 GiB over a 25-task benchmark; a long session
# with the 9b would reach ~13.6 GiB and freeze the desktop. 1 GiB still lets
# it reuse recent prompts. The runner inherits this from ollama's environment.
Environment="LLAMA_ARG_CACHE_RAM=1024"

# Hard ceiling for ollama and its runner together. If a model ever needs more,
# the kernel kills the runner inside this cgroup — the desktop keeps its RAM
# instead of grinding into swap. 9G holds the 9b (~5.7 GiB) or the 9b-mtp
# build plus the 1 GiB cache and context, leaving ~6 GiB for everything else.
MemoryMax=9G

# Keep model weights out of zram: quantized weights barely compress, so
# swapping them only burns CPU and makes generation crawl.
MemorySwapMax=0
