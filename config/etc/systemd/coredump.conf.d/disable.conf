# Don't persist core dumps. A crashed process's core can contain anything that
# was in its memory — decrypted documents, session tokens, and in KeePassXC's
# case the unlocked database. They land in /var/lib/systemd/coredump readable by
# root and survive reboots, which is a lot of exposure for data you would almost
# never actually debug on a desktop.
#
# Storage=none still lets you see that a crash happened (coredumpctl list, the
# journal entry) — it just doesn't keep the core itself.
#
# Deploy:  sudo install -Dm644 config/etc/systemd/coredump.conf.d/disable.conf \
#            /etc/systemd/coredump.conf.d/disable.conf
#          sudo systemctl daemon-reload
[Coredump]
Storage=none
ProcessSizeMax=0
