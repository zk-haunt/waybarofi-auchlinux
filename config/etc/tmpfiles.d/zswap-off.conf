# Turn zswap off at every boot — installed by scripts/zram.sh.
#
# zswap is ON by default in this kernel. It is a compressed cache in front of a
# swap device: with zram as the swap device, it would compress each page, then
# hand it to zram to compress again — CPU spent twice for nothing. The Arch wiki
# zram page recommends disabling it. Doing it here rather than with
# zswap.enabled=0 on the kernel command line avoids a bootloader edit.
# `w-`: ignore the write failing (e.g. a kernel built without zswap).
w- /sys/module/zswap/parameters/enabled - - - - N
