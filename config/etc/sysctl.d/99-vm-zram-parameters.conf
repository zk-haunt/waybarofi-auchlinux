# VM tuning for swap that lives in RAM (zram) — installed by scripts/zram.sh.
# Values are the Arch wiki's "Optimizing swap on zram" set.
#
# The defaults assume swap is a slow disk, so the kernel avoids it and drops
# page cache instead — including the code of running programs, which then
# reloads from disk. That is what happened at every OOM kill on this machine:
# page cache was down to 1–9 MiB. With zram, swapping an idle page out is a
# memory copy plus compression, far cheaper than re-reading code from the SSD,
# so tell the kernel to prefer it.

# 0–200; above 100 means "prefer swapping anonymous memory over dropping cache".
vm.swappiness = 180

# Watermark boosting reclaims extra memory after fragmentation events; with
# cheap swap it mostly causes needless reclaim churn.
vm.watermark_boost_factor = 0

# Start background reclaim earlier (1.25% of RAM instead of 0.1%), so kswapd
# frees memory before allocations have to stall waiting for it.
vm.watermark_scale_factor = 125

# Read one page per swap-in, not 2^3. Readahead helps a disk; zram has no seek.
vm.page-cluster = 0
