# Kernel/network hardening — the realistic gain without swapping kernels.
# Decided in plansecurity.md P4: zen stays (linux-hardened breaks DKMS for
# v4l2loopback and costs gaming FPS), so this is where the hardening comes from.
#
# Deploy:  sudo install -m 644 config/etc/sysctl.d/99-hardening.conf /etc/sysctl.d/
#          sudo sysctl --system
# Revert:  sudo rm /etc/sysctl.d/99-hardening.conf && sudo sysctl --system

# Hide kernel pointers from unprivileged readers (/proc, dmesg, etc.).
# Defeats the easy half of a local exploit's KASLR bypass. Was 0.
kernel.kptr_restrict = 2

# Disable the SysRq magic key combinations entirely. Was 16 (sync allowed).
# Physical-access console tricks; you have no reason to keep it on a laptop.
kernel.sysrq = 0

# Forbid loading a new kernel via kexec at runtime. Was 0.
# Removes a route to booting an unsigned kernel without touching the bootloader.
kernel.kexec_load_disabled = 1

# Ignore ICMP redirects — a hostile router/host on a shared network can
# otherwise reroute your traffic through itself. Was 1 (accepted).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Drop source-routed packets (trivially spoofable). Already 0; pinned so a
# future default change or stray drop-in can't silently re-enable it.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Reverse-path filtering: drop packets arriving on an interface they couldn't
# route back out of. 0=off, 1=strict, 2=loose.
#
# Two things make this subtler than plansecurity.md's "rp_filter=1" suggests:
#   1. The effective value per interface is max(conf.all, conf.<iface>), so
#      setting `all = 1` while lo/wlo1 sit at 2 changes NOTHING — it stays loose.
#      Only conf.all and the per-interface keys matter; conf.default applies to
#      interfaces created later.
#   2. Checked live: all=0 but default=2 and lo/wlo1=2, so filtering is already
#      ON in loose mode. It was never actually off.
#
# So loose is pinned here deliberately rather than "upgraded" to strict: strict
# drops asymmetrically-routed replies, which is exactly what a split-tunnel
# WireGuard config (scripts/vpn/) produces. Loose still blocks packets with no
# return route at all, which is the spoofing case that matters. Pinning it at 2
# means a future default change or stray drop-in cannot silently take it to 0.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# ── Added 2026-10-06 from the Lynis report (KRNL-6000). Each was checked live
#    first; the "was" value is this machine's default before the change.

# Setuid programs never write core dumps — they can hold another user's
# secrets. Was 2 (dump readable by root only). Coredumps are already discarded
# by systemd-coredump Storage=none; this closes the setuid case at the source.
fs.suid_dumpable = 0

# Refuse O_CREAT on an existing FIFO / regular file in a world- OR
# group-writable sticky directory (/tmp, /dev/shm) unless you own it. Was 1,
# which only covered world-writable dirs. Blocks the classic /tmp pre-creation
# race against privileged programs.
fs.protected_fifos = 2
fs.protected_regular = 2

# Only root may load TTY line-discipline modules. Was 1: any user could
# trigger autoloading of rarely-used ldisc code, a recurring source of local
# privilege-escalation bugs.
dev.tty.ldisc_autoload = 0

# Harden the BPF JIT (constant blinding) for every user, root included.
# Unprivileged BPF is already off (kernel.unprivileged_bpf_disabled = 2).
net.core.bpf_jit_harden = 2

# Log packets with impossible source addresses ("martians") to the kernel log.
# Was 0. Visibility only; on a noisy network this adds dmesg lines, nothing more.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
